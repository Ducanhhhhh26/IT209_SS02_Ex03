<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PTIT DevOps Course - Session 02</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #f8fafc;
        }
        .card {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 40px;
            max-width: 620px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
        }
        .badge {
            display: inline-block;
            background: rgba(225, 29, 72, 0.2);
            color: #fb7185;
            border: 1px solid rgba(225, 29, 72, 0.4);
            padding: 6px 16px;
            border-radius: 9999px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 20px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        h1 {
            font-size: 26px;
            line-height: 1.4;
            margin-bottom: 16px;
            background: linear-gradient(to right, #ffffff, #cbd5e1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p {
            color: #94a3b8;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 28px;
        }
        .server-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            background: rgba(15, 23, 42, 0.65);
            padding: 18px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            font-size: 14px;
            text-align: left;
        }
        .info-item span {
            color: #64748b;
            display: block;
            font-size: 12px;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .info-item strong {
            color: #e2e8f0;
            font-size: 14px;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="badge">Nginx Web Server</div>
        <h1>Welcome to PTIT DevOps Course - Session 02</h1>
        <p>Website tĩnh đã được triển khai thành công với Nginx Server Block trên máy chủ Ubuntu.</p>
        <div class="server-info">
            <div class="info-item">
                <span>Web Server</span>
                <strong>Nginx (HTTP Port 80)</strong>
            </div>
            <div class="info-item">
                <span>Document Root</span>
                <strong>/var/www/ptit-web/html</strong>
            </div>
        </div>
    </div>
</body>
</html>
